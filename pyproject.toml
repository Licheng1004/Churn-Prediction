[project]
name = "churn-prediction"
version = "1.0.0"
description = "Reproducible Churn-Prediction portfolio project by Licheng Xiong"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14.0",
  "scikit-learn>=1.3",
  "lightgbm>=4.0",
  "jupyterlab>=4.0"
]

[dependency-groups]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbconvert>=7,<8", "ipykernel>=6,<8"]

[tool.uv]
package = false
